name: Source quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/a35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install clang-format==18.1.8
      - name: Install native build and video validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev ffmpeg
      - name: Check C and C++ formatting
        run: python tools/check_format.py
      - name: Check shell and Python sources
        run: make script-check ota-check
      - name: Run Dashboard host tests
        run: make dashboard-check
      - name: Run frame ownership and encoder protocol tests
        run: make core-check runtime-check lifecycle-check json-check encoder-check
      - name: Compile Linux application objects
        run: |
          make object-check CC=gcc CXX=g++ CFLAGS='-Wall -Wextra -Wpedantic -Werror -O2 -std=c11 -D_DEFAULT_SOURCE -MMD -MP' CXXFLAGS='-Wall -Wextra -Wpedantic -Werror -O2 -std=c++17 -MMD -MP'
          make -C hud CC=gcc
