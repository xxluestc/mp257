name: Source quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/a35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install clang-format==18.1.8
      - name: Install native build and video validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev ffmpeg
      - name: Check C and C++ formatting
        run: python tools/check_format.py
      - name: Check shell and Python sources
        run: make script-check ota-check
      - name: Run Dashboard host tests
        run: make dashboard-check
      - name: Run frame ownership and encoder protocol tests
        run: make core-check encoder-check
      - name: Compile Linux application objects
        run: |
          make $(find src -name '*.cpp' -o -name '*.c' | sed -E 's@^@build/@; s@\.(cpp|c)$@.o@') build/hud/oled.o build/hud/cJSON.o CC=gcc CXX=g++
          make -C hud CC=gcc
