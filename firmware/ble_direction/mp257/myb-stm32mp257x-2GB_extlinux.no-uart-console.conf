# STM32MP257 current-board boot menu: USART2 is reserved for Bluetooth data.
menu title Select the boot mode
MENU BACKGROUND /splash_landscape.bmp
TIMEOUT 20
DEFAULT myb-stm32mp257x-2GB
LABEL OpenSTLinux
	KERNEL /Image.gz
	FDTDIR /
	INITRD /st-image-resize-initrd
	APPEND root=PARTUUID=491f6117-415d-4f53-88c9-6e0de54deac6 rootwait rw loglevel=${loglevel}
LABEL myb-stm32mp257x-2GB
	KERNEL /Image.gz
	FDT /myb-stm32mp257x-2GB.dtb
	INITRD /st-image-resize-initrd
	APPEND root=PARTUUID=491f6117-415d-4f53-88c9-6e0de54deac6 rootwait rw loglevel=${loglevel}
LABEL myb-stm32mp257x-2GB-ethswitch
	KERNEL /Image.gz
	FDT /myb-stm32mp257x-2GB-ethswitch.dtb
	INITRD /st-image-resize-initrd
	APPEND root=PARTUUID=491f6117-415d-4f53-88c9-6e0de54deac6 rootwait rw loglevel=${loglevel}
